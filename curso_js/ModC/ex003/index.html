<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EX003</title>

	<link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>
	<header>
		<h1>CALCULADORA SIMPLES</h1>
		<p>Praticando Eventos <strong>DOM</strong></p>
	</header>
	<main>
		<div id="_calc">
			<form>
				<fieldset class="field_input">
					<legend>
						<label for="_num1">NUMERO 1</label>
					</legend>
					<input type="text" name="num1" id="_num1">
				</fieldset>

				<fieldset class="field_input">
					<legend>
						<label for="_num2">NUMERO 2</label>
					</legend>
					<input type="text" name="num2" id="_num2">
				</fieldset>
				<div id="_options">
					<select id="_listOptions">
						<option>Soma</option>
						<option>Subtração</option>
						<option>Multiplicação</option>
						<option>Divisão</option>
					</select>
					<input type="reset" name="limpar" id="_limpar">
				</div>
			</form>
			<div id="_resultado">
				0
			</div>
		</div>
	</main>
	<script src="script.js"></script>
</body>
</html>
