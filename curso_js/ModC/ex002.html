<!DOCTYPE html>
<html lang="pt0br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EX002</title>

	<style>
		*{
			margin: 0px;
			padding: 0px;

			box-sizing: border-box;

			font-family: Arial, Helvetica, sans-serif;
		}

		body{
			display: flex;
			justify-content: center;
			align-items: center;

			height: 100vh;
			width: 100vw;
		}

		#area{
			display: flex;
			justify-content: center;
			align-items: center;

			height: 200px;
			width: 200px;

			background-color: green;
			color: white;

			border-radius: 15px;
		}
	</style>

</head>
<body>
	<div id="area" onmousedown="clicar()">
		<p>EVENTOS DOM</p>
	</div>

	<script>
		area = document.getElementById("area")
		area.addEventListener("mouseenter", entrar)
		area.addEventListener("mouseout", sair)
		area.addEventListener("mouseup", entrar)

		function clicar() {
			let div_area = document.querySelector("#area")

			div_area.style.background = "red"
			div_area.innerHTML = "<p>CLICOU!</p>"
		}

		function entrar() {
			area.style.background = "blue"
			area.innerHTML = "<p>CLIQUE AQUI...</p>"
		}

		function sair() {
			area.style.background = "green"
			area.innerHTML = "<p>EVENTOS DOM</p>"
		}
	</script>

</body>
</html>
