<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EX002</title>
</head>
<body>

	<button onclick="soma()">CLIQUE AQUI</button>

	<script>
		function soma() {
			var n1 = Number.parseInt(window.prompt("Digite o primeiro numero"))
			var n2 = window.prompt("Digite o segundo numero")

			var res = n1 + Number.parseInt(n2)

			window.alert(`A soma de ${n1} e ${n2} é igual a ${String(res)}`)
		}
	</script>

</body>
</html>
