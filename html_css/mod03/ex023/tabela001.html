<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TABELA 001</title>

	<style>
		body{
			font-family: Courier;
		}

		table{
			width: 400px;
			border-collapse: collapse;
		}

		td{
			border: 1px solid black;
			padding: 5px;
		}
	</style>

</head>
<body>
	<h1>Sobre Tabelas</h1>
	<table>
		<tr>
			<td>A1</td>
			<td>B1</td>
			<td>C1</td>
		</tr>
		<tr>
			<td>A2</td>
			<td>B2</td>
			<td>C2</td>
		</tr>
		<tr>
			<td>A3</td>
			<td>B3</td>
			<td>C3</td>
		</tr>
		<tr>
			<td>A4</td>
			<td>B4</td>
			<td>C4</td>
		</tr>
	</table>
</body>
</html>
