<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TABELA 003</title>

	<style>
		body{
			font-family: Courier;
		}

		table{
			width: 300px;
			border-collapse: collapse;
		}

		th, td{
			border: 1px solid black;
			padding: 5px;
			text-align: center;
		}
	</style>

</head>
<body>
	<h1>Mesclagem de tabelas</h1>

	<table>
		<thead>
			<tr>
				<th>tabela</th>
				<th>tabela</th>
				<th>tabela</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td>A</td>
				<td colspan="2">B</td>
			</tr>
			<tr>
				<td rowspan="3">D</td>
				<td>E</td>
				<td rowspan="2">F</td>
			</tr>
			<tr>
				<td>H</td>
			</tr>
			<tr>
				<td colspan="2">K</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
