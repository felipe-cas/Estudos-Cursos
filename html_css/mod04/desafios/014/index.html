<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PROJETO LOGIN</title>

	<link rel="stylesheet" type="text/css" href="styles/style.css">
	<link rel="stylesheet" type="text/css" href="styles/media-query-medium.css">
	<link rel="stylesheet" type="text/css" href="styles/media-query-large.css">
	
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=person,key_vertical&display=inline" rel="stylesheet" />

</head>
<body>
	<main>
		<section id="_img_login"></section>

		<section id="_form_login">
				<h1>LOGIN</h1>

				<p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>

				<form>
					<fieldset class="__fild">
						<legend>EMAIL</legend>
						<input type="email" name="email" id="_email" class="__input" placeholder="seu email" required>
						<i class="material-symbols-outlined __icon_input">person</i>
					</fieldset>
					<fieldset class="__fild">
						<legend>SENHA</legend>
						<input type="password" name="senha" id="_senha" class="__input" placeholder="sua senha" required>
						<i class="material-symbols-outlined __icon_input">key_vertical</i>
					</fieldset>
					<button id="_b_entrar" class="__button">Entrar</button>
					<button id="_b_forget" class="__button">Esqueci a senha</button>
				</form>
		</section>
	</main>
</body>
</html>
