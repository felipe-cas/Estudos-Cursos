<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PROJETO LOGIN</title>

	<link rel="stylesheet" type="text/css" href="styles/style.css">

</head>
<body>
	<main>
		<section id="_img_login"></section>

		<section id="_form_login">
				<h1>LOGIN</h1>

				<p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiemte.</p>

				<form>
					<aside>
						<label for="_email">Login</label>
						<input type="text" name="email" id="_email">
					</aside>
					<aside>
						<label for="_senha">Senha</label>
						<input type="password" name="senha" id="_senha">
					</aside>
					<button id="_b_entrar">Entrar</button>
					<button id="_b_forget">Esqueci a senha</button>
				</form>
		</section>
	</main>
</body>
</html>
