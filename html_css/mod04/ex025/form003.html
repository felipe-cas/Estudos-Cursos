<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FORMULARIO 003</title>
</head>
<body>
	<h1>INPUTS NUMERICOS</h1>

	<form>
		<p>
			<label for="i_nome">NOME</label>
			<input type="text" name="nome" id="i_nome" autocomplete="name" placeholder="seu nome" maxlength="30">
		</p>
		<p>
			<label for="i_media">Média</label>
			<input type="number" name="media" id="i_media" min="0" max="10" step="0.5" size="10">
		</p>
		<p>
			<label for="i_mes">Periodo Letivo</label>
			<input type="month" name="mes" id="i_mes">
		</p>
		<p>
			<label for="i_ano">Ano</label>
			<input type="date" name="ano" id="i_ano">
		</p>
		<p>
			<label for="i_hora">Hora</label>
			<input type="time" name="hora" id="i_hora">
		</p>

		<input type="submit" name="enviar" value="enviar">
		<input type="reset" name="apagar" value="apagar">
	</form>
</body>
</html>
