<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FORMULARIO 002</title>
</head>
<body>
	<h1>Teste de Formluario</h1>
	<form>
		<p>
			<label for="i_user">USUARIO: </label>
			<input type="text" name="user" id="i_user" required autocomplete="username" maxlength="20">
		</p>
		<p>
			<label for="i_pass">SENHA: </label>
			<input type="password" name="pass" id="i_pass" required minlength="8" maxlength="20" autocomplete="currentpassword">
		</p>
		<input type="submit" name="enviar" value="enviar">
		<input type="reset" name="limpar" value="limpar">
	</form>
</body>
</html>
