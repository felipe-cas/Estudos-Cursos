<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LINKS</title>

	<style>
		body{
			font-family: Arial, Helvitica, sans-serif;
			text-align: center;
		}

		a{
			text-decoration: none;
		}

		a:visited{
			color: indianred;
		}

		a:active{
			color: skyblue;
		}

		a:hover{
			text-decoration: underline;
		}

		a::marker{
			text-align: center;
		}
	</style>

</head>
<body>
	<h1>Personalizando links</h1>

	<ul>
		<li><a href="https://google.com" target="_blank">Acesse o Google</a></li>
		<li><a href="https://youtube.com" target="_blank">Acesse o Youtube</a></li>
		<li><a href="https://github.com" target="_blank">Acesse o GitHub</a></li>
	</ul>
</body>
</html>
