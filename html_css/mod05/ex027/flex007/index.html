<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FLEX 007</title>

	<style>
		.container{

			display: flex;
		}

		.item{
			background-color: gray;
			border: 1px solid black;

			padding: 20px;
		}

		/*G B A F E C D*/

</head>
<body>
	<div class="container">
		
		<div class="item" style="order: 2">A</div>

		<div class="item" style="order: 6">D</div>
		<div class="item" style="order: 4">E</div>
		<div class="item" style="order: 3">F</div>

	</div>
