<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FLEX 007</title>

	<style>
		.container{
			background-color: darkgray;
			display: flex;
			align-items: flex-start;

			height: 200px;
		}

		.item{
			background-color: gray;
			border: 1px solid black;

			padding: 20px;
		}
	</style>

</head>
<body>
	<div class="container">
		
		<div class="item" style="align-self: auto;">A</div>
		<div class="item" style="align-self: flex-start;">B</div>
		<div class="item" style="align-self: flex-end;">C</div>
		<div class="item" style="align-self: center;">D</div>
		<div class="item" style="align-self: stretch;">E</div>
	</div>
</body>
</html>
