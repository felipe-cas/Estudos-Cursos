<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GRID 005</title>

	<style>
		*{
			margin: 0px;
			padding: 0px;
			box-sizing: border-box;
		}

		html, body, main{
			height: 100vh;
			width: 100vw;
		}

		main{
			display: grid;
			grid-template: repeat(3, 1fr) / repeat(4, 1fr);
			gap: 10px;

			padding: 5px;
		}

		.item{
			background-color: orange;
			border: 2px solid darkseagreen;
		}

		#area1{
			grid-row-start: 1;
			grid-row-end: 2;

			grid-column-start: 1;
			grid-column-end: -1;
		}

		#area2{
			grid-row-start: 2;
			grid-row-end: -1;

			grid-column-start: 1;
			grid-column-end: 3;
		}

		#area3{
			grid-row-start: 2;
			grid-row-end: -1;

			grid-column-start: 3;
			grid-column-end: -1;
		}
	</style>

</head>
<body>
	<main>
		<div class="item" id="area1">
			<p>Área 1</p>
		</div>
		<div class="item" id="area2">
			<p>Área 2</p>
		</div>
		<div class="item" id="area3">
			<p>Área 3</p>
		</div>
	</main>
</body>
</html>
