<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GRID 006</title>

	<style>
		*{
			margin: 0px;
			padding: 0px;
			box-sizing: border-box;
		}

		html, body{
			height: 100vh;
			width: 100vw;
		}

		main{
			display: grid;
			grid-template: repeat(3, 1fr) / repeat(4, 1fr);
			gap: 10px;

			height: 100vh;
			padding: 5px;
		}

		.item{
			background-color: lightslategray;
			border-radius: 10px;
			border: 2px solid black;

			text-align: center;
		}

		#area1{
			grid-row: 1 / span 3;
			grid-column: 1 / span 2;
		}

		#area2{
			grid-area: 1 / 3 / 3 / span 2;

			background-color: darkolivegreen;
		}

		#area3{
			grid-row: 3 / -1;
			grid-column: 3 / -1;

			background-color: darkkhaki;
		}
	</style>

</head>
<body>
	<main>
		<div class="item" id="area1">
			<p>Caixa 1</p>
		</div>
		<div class="item" id="area2">
			<p>Caixa 2</p>
		</div>
		<div class="item" id="area3">
			<p>Caixa 3</p>
		</div>
	</main>
</body>
</html>
